<!doctype html>
<!-- S01:自托管 404。Cloudflare Pages 规则:无顶层 404.html 时按 SPA 处理,
     任意未知路径 200 返回根内容(soft-404);此文件让未知路由回到真 404。
     自包含单文件(内联样式,不引字体/脚本),静态托管可用。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | KnowFate</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #E7E2D5; color: #1C1B1E;
        font: 400 17px/1.65 Georgia, "Times New Roman", serif;
      }
      main { max-width: 34em; padding: 48px 24px; text-align: center; }
      .mark { width: 44px; height: 44px; margin: 0 auto 28px; }
      h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 400; margin: 0 0 12px; letter-spacing: -0.01em; }
      p { margin: 0 0 8px; color: #68635B; }
      nav { margin-top: 28px; display: flex; gap: 24px; justify-content: center; }
      a { color: inherit; text-decoration-color: rgba(28, 27, 30, .35); text-underline-offset: .22em; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M23.5 6.2A12 12 0 1 0 27.6 19" fill="none" stroke="#17161A" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="21.5" y="20.5" width="6" height="6" rx="1" fill="#A83226" transform="rotate(-4 24.5 23.5)"/>
      </svg>
      <h1>This page doesn't exist.</h1>
      <p><span lang="zh-Hant">找不到這一頁。可能已搬移,或地址有誤。</span></p>
      <!-- S06:规格给 Library / 首页 / 排盘器三类入口(纯静态文件,读不到
           config 开关,链接硬编码;排盘器一期即锁框版页面,可直链)。 -->
      <nav>
        <a href="/en">English</a>
        <a href="/en/library">Library</a>
        <a href="/en/bazi-calculator">BaZi calculator</a>
        <a href="/zh-hant" hreflang="zh-Hant" lang="zh-Hant">繁體中文</a>
        <a href="/zh-hant/library" hreflang="zh-Hant" lang="zh-Hant">知識庫</a>
      </nav>
    </main>
  </body>
</html>
