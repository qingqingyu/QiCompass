# QiCompass 生产编排(S2,2026-11-18;docs/后端部署设计决策.md §2)
#
# 关键决策(改前先读文档对应节):
# - api 的 8000 只 expose 不 publish:唯一公网入口 Caddy :443(§2.2)
# - 固定 compose 子网 172.28.0.0/16:.env 的 FORWARDED_ALLOW_IPS 照抄同值,
#   消除「默认网段漂移 → X-Forwarded-For 不被信任 → 匿名配额全站共享一份」
#   的静默坑(§2.3,uvicorn ≥0.31 才认 CIDR)
# - .env 以**文件挂载**而非 env_file 注入:run.sh 的 source 语义与本地完全
#   一致,多行 APP_STORE_PRIVATE_KEY(.p8 整段)不经 compose dotenv 再解析
# - FORWARDED_ALLOW_IPS 经 environment 兜底 172.28.0.0/16:该值漏配**不报错**,
#   只是 X-Forwarded-For 不被信任、全站匿名共享一份免费配额(§2.3);子网
#   已被本文件固定,正确值确定可知,漏配时兜底。.env 显式配置仍优先生效
#   (compose 插值 ${VAR:-def} 读的正是项目目录同一份 .env,与 run.sh source
#   同源不冲突)
# - 日志 json-file 轮转(§6 P2):2c2g/40GB 单机,uvicorn 每请求 access log
#   无上限会写满盘——盘上还有 entitlement 的钱和账号,写满 = 全站下线
# - stop_grace_period 210s > 优雅停机 200s(run.sh --timeout-graceful-
#   shutdown):发版重启让进行中 LLM 请求跑完,防 SIGKILL 抢在宽限期前(§2.3)
# - ./data 卷 = SQLite + images/(全部单机状态,备份对象;§4)。镜像以非 root
#   uid 10001 运行(2026-11-21):部署时宿主侧 `sudo chown -R 10001:10001 ./data`,
#   漏做时 run.sh 启动自检 fail-fast 并带该指引(不会静默降级)
# - ./certs 挂到 app/entitlement/certs:Apple Root CA(.cer)不入 git,部署时
#   从 apple.com/certificateauthority 下载放入宿主 ./certs(env 配齐而缺失
#   = 启动 fail-fast)
# - 发版流程见 §5:备份 db → 改 tag → up -d → curl /api/health + /api/health/llm

name: qicompass

# x-logging:两服务共用,轮转参数见顶部注释(§6 P2)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  api:
    build: .
    image: qicompass-api:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      # 见顶部注释:.env 漏配时兜底子网值,防静默配额合并
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.0/16}
    volumes:
      # .env 用 long-form bind 且 create_host_path: false:缺失时 compose 显式
      # 报错(2026-11-18 S2 review)——短语法下 Docker 会在宿主自动建出同名
      # **目录**,之后 cp .env.example .env 都会被目录占名挡住,须手工 rmdir。
      # ./data ./certs 维持短语法自动建目录:空 data/ = 新库正确初态;空
      # certs/ 由 app 启动 fail-fast 给出带指引的报错。
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ./data:/app/data
      - ./certs:/app/app/entitlement/certs:ro
    expose:
      - "8000"
    stop_grace_period: 210s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddyfile 经 {$API_DOMAIN} 消费;改域名改这里(或 .env 同名变量)
      API_DOMAIN: ${API_DOMAIN:-api.knowfate.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        # 2026-11-21 推前 review 可选项落地:等 api 健康探针通过再起
        # (api 起不来时 Caddy 不监听 80/443,不出现「域名通但 5xx」中间态)
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  caddy_data:
  caddy_config:
