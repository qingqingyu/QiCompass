<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>App icon template</title>
<!-- 1024×1024 图标渲染模板：?v=A|B|C&g=观|觀。由 render.js 用 Playwright 截图成 PNG。
     字体直接引用 App 打包的思源宋体子集，保证图标字形与 App 内印章一致。 -->
<style>
  @font-face { font-family: "QiSongti"; src: url("../../../ios/QiCompass/QiCompass/Resources/QiSongti-Regular.otf"); }
  @font-face { font-family: "QiSongtiTC"; src: url("../../../ios/QiCompass/QiCompass/Resources/QiSongtiTC-Regular.otf"); }
  :root { --paper: #F5EFE1; --red: #C33B3B; --ink: #17161A; }  /* 与现有 AppIcon-1024.png 取色一致 */
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: var(--paper); }
  .c { position: absolute; inset: 0; display: grid; place-items: center; }
  .g { font-weight: 400; line-height: 1; color: var(--red); }
  .sc { font-family: "QiSongti"; } .tc { font-family: "QiSongtiTC"; }
  /* A:与现有「玄」同构 */
  .A .g { font-size: 640px; transform: translateY(-8px); }
  /* B:朱印方框阴文 */
  .B .seal { width: 700px; height: 700px; background: var(--red); border-radius: 36px; display: grid; place-items: center;
             box-shadow: inset 0 0 0 20px var(--red), inset 0 0 0 30px rgba(245,239,225,.85); }
  .B .g { color: var(--paper); font-size: 500px; transform: translateY(-6px); }
  /* C:墨圆 + 朱字 */
  .C svg { position: absolute; inset: 0; }
  .C .g { font-size: 460px; transform: translateY(-4px); }
</style>
</head>
<body>
<div id="root" class="c"></div>
<script>
  var q = new URLSearchParams(location.search), v = q.get("v") || "A", g = q.get("g") || "观";
  var font = g === "觀" ? "tc" : "sc", root = document.getElementById("root");
  root.className = "c " + v;
  if (v === "A") root.innerHTML = '<span class="g ' + font + '">' + g + '</span>';
  if (v === "B") root.innerHTML = '<div class="seal"><span class="g ' + font + '">' + g + '</span></div>';
  if (v === "C") root.innerHTML =
    '<svg viewBox="0 0 1024 1024"><defs><filter id="r" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="18"/></filter></defs>' +
    '<path d="M742,250 A350,350 0 1,0 852,610" fill="none" stroke="#17161A" stroke-width="44" stroke-linecap="round" filter="url(#r)"/></svg>' +
    '<span class="g ' + font + '">' + g + '</span>';
  if (v === "OLD") root.innerHTML = '<span class="g sc" style="font-size:640px">玄</span>';
</script>
</body>
</html>
