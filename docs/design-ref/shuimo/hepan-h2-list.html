<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>H2 · 合盘 · 结果列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 40% at 50% 0%, #F8F7F3 0%, transparent 52%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
    display: flex; flex-direction: column;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .head { flex: none; padding: 62px 34px 16px; border-bottom: 1px solid rgba(28,27,30,.14);
          display: flex; align-items: baseline; }
  .t { font-size: 21px; letter-spacing: .12em; }
  .n { margin-left: auto; font-size: 11px; color: #8B867D; letter-spacing: .2em; }

  .pairs { flex: 1; overflow: hidden; padding: 14px 34px 0; }
  .pair { margin-bottom: 16px; padding: 16px 18px; border: 1px solid rgba(28,27,30,.22); border-radius: 4px; position: relative; }
  .duo { display: flex; align-items: center; gap: 10px; }
  .pname { font-size: 15.5px; font-weight: 500; letter-spacing: .06em; }
  .x { font-size: 11px; color: #A5A098; letter-spacing: .1em; }
  .duo .seal-mini { margin-left: auto; width: 20px; height: 20px; background: #A83226; color: #F6F1E7;
    font-size: 10px; display: flex; align-items: center; justify-content: center; transform: rotate(4deg);
    mix-blend-mode: multiply; }
  .ding { margin-top: 10px; font-size: 12.5px; color: #55524C; letter-spacing: .08em; line-height: 1.9; }
  .ding b { color: #2F5E4A; font-weight: 500; }
  .ding .warn { color: #8B867D; }
  .foot-row { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(28,27,30,.16);
              display: flex; align-items: center; gap: 8px; }
  .chips { display: flex; gap: 6px; flex: 1; }
  .fchip { font-size: 9.5px; padding: 2px 8px; border: 1px solid rgba(28,27,30,.22); border-radius: 2px; color: #8B867D; letter-spacing: .08em; }
  .fchip.paid { border-color: rgba(168,50,38,.5); color: #A83226; }
  .state { font-size: 10px; letter-spacing: .2em; color: #A5A098; }
  .state.done { color: #2F5E4A; }

  .sp { flex: 1; }
  .tabbar { flex: none; height: 82px; border-top: 1px solid rgba(28,27,30,.14); display: flex; padding-top: 12px; background: #F3F1EC; }
  .tab { flex: 1; text-align: center; font-size: 12px; letter-spacing: .18em; color: #A5A098; position: relative; }
  .tab.on { color: #1C1B1E; font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    width: 4px; height: 4px; background: #A83226; border-radius: 50%; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="head">
    <div class="t">2 对合盘已排好</div>
    <div class="n">免费总览 · 每对独立解锁</div>
  </div>

  <div class="pairs">
    <div class="pair">
      <div class="duo">
        <span class="pname">我自己</span><span class="x">与</span><span class="pname">男友</span>
        <span class="seal-mini">合</span>
      </div>
      <div class="ding">磁场合拍 · <b>五行互补佳</b>——你缺的火他带，他浮的木你稳。<span class="warn">无评分，只讲相处方式。</span></div>
      <div class="foot-row">
        <div class="chips">
          <span class="fchip">总览已读</span>
          <span class="fchip paid">五行共振 未解锁</span>
        </div>
        <div class="state">查看 ›</div>
      </div>
    </div>

    <div class="pair">
      <div class="duo">
        <span class="pname">我自己</span><span class="x">与</span><span class="pname">妈妈</span>
        <span class="seal-mini">合</span>
      </div>
      <div class="ding">磁场合拍 · <b>水木相生</b>——她的关心落在你的印上，被支持感强，边界感需练。</div>
      <div class="foot-row">
        <div class="chips">
          <span class="fchip">总览已读</span>
          <span class="fchip paid">五行共振 未解锁</span>
        </div>
        <div class="state">查看 ›</div>
      </div>
    </div>

    <div class="pair" style="border-color: rgba(168,50,38,.35);">
      <div class="duo">
        <span class="pname">合伙人</span><span class="x">·</span><span class="pname" style="color:#8B867D;">临时输入</span>
      </div>
      <div class="ding" style="color:#8B867D;">这一对排盘失败：出生信息缺时辰。<br>点开补一项即可，不影响其余各对。</div>
      <div class="foot-row">
        <div class="chips"><span class="fchip">对级隔离</span></div>
        <div class="state" style="color:#A83226;">补时辰 ›</div>
      </div>
    </div>
  </div>

  <div class="sp"></div>
  <div class="tabbar">
    <div class="tab">今日</div><div class="tab">深度</div><div class="tab on">合盘</div><div class="tab">我的</div>
  </div>
</body>
</html>
