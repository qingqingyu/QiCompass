<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>T3 · 今日运势 · 签纸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(100% 50% at 50% 0%, #EBE8E0 0%, #F3F1EC 70%);
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
    display: flex; flex-direction: column;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .head { flex: none; padding: 60px 34px 0; display: flex; align-items: baseline; gap: 12px; }
  .d1 { font-size: 20px; letter-spacing: .06em; }
  .d1 small { font-size: 12px; color: #77726A; margin-left: 4px; }
  .meta { margin-left: auto; font-size: 10px; color: #8B867D; letter-spacing: .1em; text-align: right; line-height: 1.9; }

  /* 签纸 */
  .slip-wrap { flex: none; margin-top: 26px; display: flex; justify-content: center; }
  .slip {
    width: 300px; background: #FAF9F4; position: relative;
    padding: 34px 28px 24px;
    transform: rotate(-1.2deg);
    box-shadow: 0 14px 34px rgba(23,22,26,.14);
    animation: drop 0.8s cubic-bezier(.2,1,.35,1) .15s both;
  }
  @keyframes drop { from { opacity: 0; transform: rotate(-1.2deg) translateY(-26px);} to { opacity: 1; transform: rotate(-1.2deg) translateY(0);} }
  /* 撕纸毛边 */
  .slip::before {
    content: ""; position: absolute; left: 0; right: 0; top: -7px; height: 8px;
    background:
      linear-gradient(135deg, #FAF9F4 5px, transparent 0) 0 0 / 16px 16px repeat-x,
      linear-gradient(-135deg, #FAF9F4 5px, transparent 0) 8px 0 / 16px 16px repeat-x;
    filter: drop-shadow(0 -1px 0 rgba(23,22,26,.08));
  }
  .slip-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .liuri { font-size: 10.5px; color: #8B867D; letter-spacing: .18em; line-height: 2; }
  .qian-title {
    writing-mode: vertical-rl; font-size: 27px; letter-spacing: .3em; font-weight: 600;
    color: #17161A; margin: 10px 2px 0 0; padding-left: 14px; border-left: 1px solid rgba(28,27,30,.2);
  }
  .qian-body {
    margin-top: 18px; writing-mode: vertical-rl;
    font-size: 13.5px; line-height: 2.5; letter-spacing: .16em;
    color: #33312E; height: 208px;
  }
  .qian-foot { margin-top: 18px; display: flex; justify-content: space-between; align-items: flex-end;
               padding-top: 12px; border-top: 1px dashed rgba(28,27,30,.22); }
  .stamps { display: flex; gap: 8px; }
  .stamp { font-size: 10px; padding: 3px 8px; letter-spacing: .1em; border-radius: 2px; }
  .stamp.yi { border: 1px solid rgba(47,94,74,.45); color: #2F5E4A; }
  .stamp.ji { border: 1px solid rgba(28,27,30,.25); color: #8B867D; }
  .seal {
    width: 24px; height: 24px; background: #A83226; color: #F6F1E7; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(4deg); mix-blend-mode: multiply;
    animation: stamp .45s cubic-bezier(.3,1.6,.5,1) 1s both;
    box-shadow: inset 0 0 0 1.2px rgba(246,241,231,.35);
  }
  @keyframes stamp { from { opacity: 0; transform: rotate(4deg) scale(1.9);} to { opacity: .95; transform: rotate(4deg) scale(1);} }

  .tomorrow { flex: none; margin: 24px 48px 0; display: flex; align-items: baseline; gap: 10px; justify-content: center; }
  .tl { font-size: 10px; letter-spacing: .3em; color: #A5A098; }
  .tt { font-size: 12px; color: #55524C; letter-spacing: .06em; }

  .sp { flex: 1; }
  .tabbar { flex: none; height: 82px; border-top: 1px solid rgba(28,27,30,.14); display: flex; padding-top: 12px; background: #F3F1EC; }
  .tab { flex: 1; text-align: center; font-size: 12px; letter-spacing: .18em; color: #A5A098; position: relative; }
  .tab.on { color: #1C1B1E; font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    width: 4px; height: 4px; background: #A83226; border-radius: 50%; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="head">
    <div class="d1">8月26日<small>周三</small></div>
    <div class="meta">农历七月十四<br>丙午年 甲申月 壬子日</div>
  </div>

  <div class="slip-wrap">
    <div class="slip">
      <div class="slip-top">
        <div class="liuri">流日 壬子<br>七杀主事 · 冲马</div>
        <div class="qian-title">慎中得进</div>
      </div>
      <div class="qian-body">
        杀透而印伏，事紧而心明。&nbsp;&nbsp;难事置于午前，午后宜收不宜攻。&nbsp;&nbsp;少接一事，多得一分主动。
      </div>
      <div class="qian-foot">
        <div class="stamps">
          <span class="stamp yi">宜 静思 · 会友</span>
          <span class="stamp ji">忌 争执 · 大额支出</span>
        </div>
        <div class="seal">玄</div>
      </div>
    </div>
  </div>

  <div class="tomorrow">
    <span class="tl">明日预告</span>
    <span class="tt">癸丑日 · 七杀渐退，宜复盘 ›</span>
  </div>

  <div class="sp"></div>
  <div class="tabbar">
    <div class="tab on">今日</div><div class="tab">深度</div><div class="tab">合盘</div><div class="tab">我的</div>
  </div>
</body>
</html>
