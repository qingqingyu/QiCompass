<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O4 · 生肖揭晓</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 55% at 50% 12%, #F8F7F3 0%, transparent 58%),
                radial-gradient(80% 50% at 50% 100%, #EDEBE4 0%, transparent 55%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .hero { position: absolute; left: 0; right: 0; top: 84px; display: flex; flex-direction: column; align-items: center; }
  .enso { width: 128px; height: 128px; position: relative;
          opacity: 0; animation: inkIn 1.4s cubic-bezier(.2,.6,.2,1) .1s forwards, breathe 7s ease-in-out 2.4s infinite; }
  @keyframes inkIn { from { opacity: 0; filter: blur(6px);} to { opacity: 1; filter: blur(0);} }
  @keyframes breathe { 0%,100% { opacity: 1;} 50% { opacity: .93;} }
  .zchar {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-54%);
    font-size: 62px; color: #17161A;
  }
  .main { margin-top: 24px; font-size: 21px; letter-spacing: .22em; text-indent: .22em; opacity: 0; animation: tIn 1s ease .55s forwards; }
  .main .accent { color: #A83226; }
  .sub { margin-top: 10px; font-size: 12px; letter-spacing: .3em; text-indent: .3em; color: #77726A; opacity: 0; animation: tIn 1s ease .7s forwards; }
  @keyframes tIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px);} to { opacity: 1; transform: none; filter: blur(0);} }

  .persona {
    position: absolute; left: 56px; right: 56px; top: 402px;
    font-size: 13px; line-height: 2; text-align: center; color: #3A3833;
    opacity: 0; animation: tIn 1s ease .85s forwards;
  }

  .row-label { font-size: 10px; letter-spacing: .3em; text-indent: .3em; color: #8B867D; text-align: center; }
  .friends { position: absolute; left: 0; right: 0; top: 528px; opacity: 0; animation: tIn 1s ease 1.05s forwards; }
  .chips { margin-top: 14px; display: flex; justify-content: center; gap: 18px; }
  .zchip {
    width: 52px; height: 52px; border-radius: 50%; border: 1.2px solid rgba(63,94,80,.65);
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #2F5E4A;
    background: rgba(63,94,80,.06); position: relative;
  }
  .zchip .tag { position: absolute; bottom: -19px; font-size: 8.5px; color: #8B867D; letter-spacing: .1em; }

  .clash { position: absolute; left: 0; right: 0; top: 646px; opacity: 0; animation: tIn 1s ease 1.25s forwards; }
  .clash .chips .zchip { border-color: rgba(28,27,30,.3); color: #77726A; background: none; }

  .stance {
    position: absolute; left: 0; right: 0; bottom: 156px; text-align: center;
    font-size: 10px; letter-spacing: .26em; text-indent: .26em; color: #A5A098;
    opacity: 0; animation: tIn 1s ease 1.45s forwards;
  }
  .cta {
    position: absolute; bottom: 62px; left: 50%; transform: translateX(-50%);
    width: 286px; height: 54px; background: #17161A; color: #F3F1EC;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 16px; letter-spacing: .24em; text-indent: .24em; border-radius: 5px;
    opacity: 0; animation: tIn .8s ease 1.6s forwards;
  }
  .cta .seal-dot { width: 7px; height: 7px; background: #A83226; transform: rotate(45deg); }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="hero">
    <div class="enso">
      <svg viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
        <defs><filter id="r4"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter></defs>
        <path d="M99,25 A48,48 0 1,0 110,73" fill="none" stroke="#17161A" stroke-width="8.5" stroke-linecap="round" filter="url(#r4)"/>
      </svg>
      <div class="zchar">马</div>
    </div>
    <div class="main">属马 · <span class="accent">丙午之驹</span></div>
    <div class="sub">热烈坦荡 · 千里之志</div>
  </div>

  <div class="persona">属马的人心气明亮，认定的事一路奔到底；<br>像原野上的风，自由，也重情。</div>

  <div class="friends">
    <div class="row-label">好朋友 · 六合三合</div>
    <div class="chips">
      <div class="zchip">羊<span class="tag">六合</span></div>
      <div class="zchip">虎<span class="tag">三合</span></div>
      <div class="zchip">狗<span class="tag">三合</span></div>
    </div>
  </div>

  <div class="clash">
    <div class="row-label">需磨合 · 六冲</div>
    <div class="chips"><div class="zchip">鼠<span class="tag">六冲</span></div></div>
  </div>

  <div class="stance">命理提供视角 · 选择始终在你</div>
  <div class="cta">查看今日运势<span class="seal-dot"></span></div>
</body>
</html>
