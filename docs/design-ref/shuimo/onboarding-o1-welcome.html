<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O1 · 承接欢迎</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 60% at 40% 20%, #F8F7F3 0%, transparent 60%),
                radial-gradient(80% 55% at 75% 90%, #EDEBE4 0%, transparent 55%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .brand { position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; }
  .enso { width: 172px; height: 172px; position: relative;
          opacity: 0; animation: inkIn 1.5s cubic-bezier(.2,.6,.2,1) .15s forwards, breathe 7s ease-in-out 2.6s infinite; }
  @keyframes inkIn { from { opacity: 0; filter: blur(7px);} to { opacity: 1; filter: blur(0);} }
  @keyframes breathe { 0%,100% { opacity: 1;} 50% { opacity: .93;} }
  .seal-in {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(3deg);
    width: 34px; height: 34px; background: #A83226; color: #F6F1E7; font-size: 15px;
    display: flex; align-items: center; justify-content: center; mix-blend-mode: multiply;
    box-shadow: inset 0 0 0 1.5px rgba(246,241,231,.35);
    opacity: 0; animation: stamp .5s cubic-bezier(.3,1.6,.5,1) 1.5s forwards;
  }
  @keyframes stamp { from { opacity: 0; transform: translate(-50%,-50%) rotate(3deg) scale(1.8);} to { opacity: .94; transform: translate(-50%,-50%) rotate(3deg) scale(1);} }

  h1 { margin-top: 30px; font-size: 27px; font-weight: 500; letter-spacing: .3em; text-indent: .3em; opacity: 0; animation: tIn 1.1s ease .8s forwards; }
  .latin { margin-top: 12px; font-family: "Avenir Next", sans-serif; font-size: 8.5px; letter-spacing: .6em; text-indent: .6em; color: #A5A098; opacity: 0; animation: tIn 1.1s ease .95s forwards; }
  .sub { margin-top: 14px; font-size: 12.5px; letter-spacing: .28em; text-indent: .28em; color: #77726A; opacity: 0; animation: tIn 1.1s ease 1.1s forwards; }
  @keyframes tIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px);} to { opacity: 1; transform: none; filter: blur(0);} }

  .sutra {
    position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    writing-mode: vertical-rl; font-size: 17px; letter-spacing: .34em;
    padding: 18px 10px; border-left: 1px solid rgba(28,27,30,.2);
    opacity: 0; animation: tIn 1.3s ease 1.3s forwards;
  }
  .dots { position: absolute; bottom: 62px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
          opacity: 0; animation: tIn 1s ease 1.9s forwards; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(28,27,30,.22); }
  .dot.on { background: #A83226; }
  .hint { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: .3em; color: #A5A098;
          opacity: 0; animation: tIn 1s ease 2.1s forwards; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="brand">
    <div class="enso">
      <svg viewBox="0 0 172 172" width="172" height="172" aria-hidden="true">
        <defs><filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8"/></filter></defs>
        <path d="M133,33 A64,64 0 1,0 148,97" fill="none" stroke="#17161A" stroke-width="11" stroke-linecap="round" filter="url(#r)"/>
        <path d="M133,33 A64,64 0 1,0 148,97" fill="none" stroke="#17161A" stroke-width="4" stroke-linecap="round" filter="url(#r)" opacity=".5"/>
      </svg>
      <div class="seal-in">玄</div>
    </div>
    <h1>玄机问道</h1>
    <div class="latin">QICOMPASS</div>
    <div class="sub">读懂你的命局</div>
  </div>

  <div class="sutra">不知命，无以为君子也</div>

  <div class="dots"><span class="dot on"></span><span class="dot"></span></div>
  <div class="hint">左滑录入生辰 ›</div>
</body>
</html>
