<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>T1 · 今日运势 · 墨白节奏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 40% at 50% 0%, #F8F7F3 0%, transparent 50%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
    display: flex; flex-direction: column;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .head { flex: none; padding: 62px 34px 0; }
  .drow { display: flex; align-items: baseline; gap: 12px; }
  .d1 { font-size: 24px; letter-spacing: .06em; }
  .d1 small { font-size: 13px; color: #77726A; letter-spacing: .1em; margin-left: 6px; }
  .d2 { margin-left: auto; font-size: 11px; color: #8B867D; letter-spacing: .12em; }
  .liuri { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .liuri .lab { font-size: 10px; letter-spacing: .3em; color: #A5A098; }
  .liuri .pillar { font-size: 16px; letter-spacing: .2em; }
  .chip { padding: 3px 10px; font-size: 11px; letter-spacing: .14em; border: 1px solid rgba(28,27,30,.35); border-radius: 2px; color: #55524C; }
  .chip.rel { border-color: rgba(168,50,38,.55); color: #A83226; }
  .chip.chong { color: #8B867D; border-color: rgba(28,27,30,.22); }

  .hero { position: relative; flex: none; margin-top: 26px; padding: 30px 44px 0; }
  .hero .enso {
    position: absolute; right: 6px; top: 0; width: 150px; height: 150px; opacity: .09;
    animation: breathe 8s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .09;} 50% { opacity: .13;} }
  .hero .k { font-size: 10px; letter-spacing: .4em; color: #A5A098; margin-bottom: 14px; }
  .hero p { font-size: 15.5px; line-height: 2.2; letter-spacing: .03em; color: #26242A; }
  .hero p .em { border-bottom: 1px solid rgba(168,50,38,.6); padding-bottom: 1px; }

  .yiji { flex: none; margin: 24px 34px 0; padding: 16px 0; border-top: 1px solid rgba(28,27,30,.14); border-bottom: 1px solid rgba(28,27,30,.14); }
  .yrow { display: flex; align-items: flex-start; gap: 14px; padding: 7px 0; }
  .ylab { flex: none; font-size: 14px; letter-spacing: .2em; }
  .yrow.yi .ylab { color: #2F5E4A; }
  .yrow.ji .ylab { color: #A83226; opacity: .8; }
  .ychips { display: flex; flex-wrap: wrap; gap: 8px; }
  .ychip { font-size: 12px; letter-spacing: .1em; padding: 4px 12px; border-radius: 2px; }
  .yrow.yi .ychip { border: 1px solid rgba(47,94,74,.4); color: #2F5E4A; }
  .yrow.ji .ychip { border: 1px solid rgba(28,27,30,.22); color: #8B867D; }

  .hours { flex: none; margin: 18px 34px 0; display: flex; align-items: center; gap: 12px; }
  .hdots { display: flex; gap: 7px; align-items: center; }
  .hd { width: 5px; height: 5px; border-radius: 50%; background: rgba(28,27,30,.2); }
  .hd.now { background: #A83226; width: 7px; height: 7px; }
  .htxt { margin-left: auto; font-size: 11px; letter-spacing: .18em; color: #77726A; }
  .htxt b { color: #A83226; font-weight: 500; }

  .tomorrow { flex: none; margin: 18px 34px 0; padding-top: 14px; border-top: 1px solid rgba(28,27,30,.14);
              display: flex; align-items: baseline; gap: 10px; }
  .tl { font-size: 10px; letter-spacing: .3em; color: #A5A098; }
  .tt { font-size: 12.5px; color: #55524C; letter-spacing: .06em; }
  .ta { margin-left: auto; color: #A5A098; }

  .sp { flex: 1; }
  .tabbar { flex: none; height: 82px; border-top: 1px solid rgba(28,27,30,.14); display: flex; padding-top: 12px; background: #F3F1EC; }
  .tab { flex: 1; text-align: center; font-size: 12px; letter-spacing: .18em; color: #A5A098; position: relative; }
  .tab.on { color: #1C1B1E; font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    width: 4px; height: 4px; background: #A83226; border-radius: 50%; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="head">
    <div class="drow">
      <div class="d1">8月26日<small>周三</small></div>
      <div class="d2">农历 七月十四 · 丙午年 甲申月</div>
    </div>
    <div class="liuri">
      <span class="lab">流日</span>
      <span class="pillar">壬子</span>
      <span class="chip rel">七杀</span>
      <span class="chip chong">冲马</span>
    </div>
  </div>

  <div class="hero">
    <svg class="enso" viewBox="0 0 150 150" aria-hidden="true">
      <defs><filter id="r5"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8"/></filter></defs>
      <path d="M116,29 A56,56 0 1,0 129,85" fill="none" stroke="#17161A" stroke-width="10" stroke-linecap="round" filter="url(#r5)"/>
    </svg>
    <div class="k">今 日 解 读</div>
    <p>甲申月壬子日，七杀透出。外部节奏偏紧，但你的<span class="em">判断力在线</span>。上午思路最清，难谈的事放在午前；午后能量回落，宜收不宜攻。少接一件事，就多一分主动。</p>
  </div>

  <div class="yiji">
    <div class="yrow yi">
      <span class="ylab">宜</span>
      <div class="ychips"><span class="ychip">静思</span><span class="ychip">整理</span><span class="ychip">会友</span></div>
    </div>
    <div class="yrow ji">
      <span class="ylab">忌</span>
      <div class="ychips"><span class="ychip">争执</span><span class="ychip">熬夜</span><span class="ychip">大额支出</span></div>
    </div>
  </div>

  <div class="hours">
    <div class="hdots">
      <span class="hd"></span><span class="hd"></span><span class="hd"></span><span class="hd"></span>
      <span class="hd"></span><span class="hd"></span><span class="hd"></span><span class="hd now"></span>
      <span class="hd"></span><span class="hd"></span><span class="hd"></span><span class="hd"></span>
    </div>
    <div class="htxt">十二时辰 · 当前 <b>未时</b> ›</div>
  </div>

  <div class="tomorrow">
    <span class="tl">明日</span>
    <span class="tt">癸丑日 · 七杀渐退，宜复盘</span>
    <span class="ta">›</span>
  </div>

  <div class="sp"></div>
  <div class="tabbar">
    <div class="tab on">今日</div><div class="tab">深度</div><div class="tab">合盘</div><div class="tab">我的</div>
  </div>
</body>
</html>
