<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>P4 · M4 健康续航 · 补充信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: #F3F1EC; font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; z-index: 6;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
  .dim-bg { position: absolute; inset: 0; background: rgba(28,27,30,.42); backdrop-filter: blur(2px); }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 430px;
    background: #F6F5F0; border-radius: 18px 18px 0 0;
    box-shadow: 0 -18px 50px rgba(23,22,26,.3);
    padding: 0 34px; display: flex; flex-direction: column;
    animation: rise .5s cubic-bezier(.2,.8,.3,1) .1s both;
  }
  @keyframes rise { from { transform: translateY(60%); opacity: .4; } to { transform: none; opacity: 1; } }
  .grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(28,27,30,.25); margin: 10px auto 0; }

  .head { margin-top: 16px; }
  .kicker { font-size: 10px; letter-spacing: .4em; color: #8B867D; }
  .ht { margin-top: 6px; font-size: 20px; letter-spacing: .16em; }
  .hs { margin-top: 6px; font-size: 11px; color: #8B867D; letter-spacing: .12em; line-height: 1.8; }

  .q { margin-top: 20px; }
  .ql { font-size: 12.5px; letter-spacing: .2em; margin-bottom: 12px; }
  .ql .req { color: #A83226; }
  .stepper { display: flex; align-items: center; gap: 0; border: 1px solid rgba(28,27,30,.3); border-radius: 4px; width: 190px; }
  .stepper .b { flex: 1; text-align: center; font-size: 18px; color: #55524C; padding: 9px 0; }
  .stepper .v { flex: none; width: 84px; text-align: center; font-size: 16px; border-left: 1px solid rgba(28,27,30,.2); border-right: 1px solid rgba(28,27,30,.2); padding: 10px 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    padding: 8px 16px; border: 1px solid rgba(28,27,30,.32); border-radius: 3px;
    font-size: 13px; letter-spacing: .1em; color: #55524C;
  }
  .chip.on { background: #1C1B1E; color: #F3F1EC; border-color: #1C1B1E; }

  .foot { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 30px; }
  .cta {
    height: 54px; background: #17161A; color: #F3F1EC; border-radius: 5px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 16px; letter-spacing: .26em; text-indent: .26em;
  }
  .cta .seal-dot { width: 7px; height: 7px; background: #A83226; transform: rotate(45deg); }
  .skip { margin-top: 12px; text-align: center; font-size: 10.5px; color: #A5A098; letter-spacing: .2em; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="dim-bg"></div>

  <div class="sheet">
    <div class="grabber"></div>

    <div class="head">
      <div class="kicker">第 伍 章 · 生成前两问</div>
      <div class="ht">健康续航 · 因你而异</div>
      <div class="hs">这一章结合你的年龄与近况推演，答案只影响本章内容。</div>
    </div>

    <div class="q">
      <div class="ql">你的年龄 <span class="req">· 必答</span></div>
      <div class="stepper">
        <div class="b">−</div><div class="v">32 岁</div><div class="b">＋</div>
      </div>
    </div>

    <div class="q">
      <div class="ql">近来的身体状况 <span class="req">· 至少一项</span></div>
      <div class="chips">
        <div class="chip on">睡眠浅</div>
        <div class="chip">久坐</div>
        <div class="chip on">易疲惫</div>
        <div class="chip">肩颈紧</div>
        <div class="chip">情绪波动</div>
        <div class="chip">其他</div>
      </div>
    </div>

    <div class="foot">
      <div class="cta">生成本章<span class="seal-dot"></span></div>
      <div class="skip">稍后在章节内补答也可</div>
    </div>
  </div>
</body>
</html>
