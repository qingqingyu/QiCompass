<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>P1 · 深度解析 · 章节列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 50% at 50% 0%, #F8F7F3 0%, transparent 55%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
    display: flex; flex-direction: column;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .head { padding: 66px 32px 0; flex: none; }
  .kicker { font-size: 10px; letter-spacing: .4em; color: #8B867D; }
  .title { margin-top: 8px; font-size: 26px; letter-spacing: .2em; }
  .chart { margin-top: 18px; display: flex; align-items: center; gap: 20px; padding-bottom: 18px;
           border-bottom: 1px solid rgba(28,27,30,.16); }
  .pillars { display: flex; gap: 14px; }
  .pillar { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .pillar .lab { font-size: 8px; letter-spacing: .2em; color: #A5A098; }
  .pillar .zi { font-size: 15px; letter-spacing: .05em; }
  .who { margin-left: auto; text-align: right; font-size: 11px; line-height: 2; color: #77726A; }
  .who b { font-size: 13px; color: #1C1B1E; font-weight: 500; }

  .list { flex: 1; overflow: hidden; padding: 10px 32px 0; }
  .row { display: flex; align-items: center; gap: 16px; padding: 13px 0;
         border-bottom: 1px solid rgba(28,27,30,.09); }
  .num {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    border: 1px solid rgba(28,27,30,.4); color: #1C1B1E;
  }
  .row.locked .num { border-style: dashed; border-color: rgba(28,27,30,.28); color: #B3AEA4; }
  .row.cur .num { border-color: #A83226; color: #A83226; }
  .mid { flex: 1; min-width: 0; }
  .t { font-size: 15.5px; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
  .row.locked .t { color: #8B867D; }
  .d { margin-top: 4px; font-size: 11px; color: #A5A098; letter-spacing: .04em;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { flex: none; font-size: 10px; letter-spacing: .15em; color: #A5A098; }
  .state.read { color: #5B7B6A; }
  .state.now { color: #A83226; }
  .state .tag {
    display: inline-block; padding: 2px 7px; border: 1px solid rgba(168,50,38,.5);
    color: #A83226; font-size: 9px; border-radius: 2px; transform: rotate(-2deg);
  }

  .tabbar {
    flex: none; height: 82px; border-top: 1px solid rgba(28,27,30,.14);
    display: flex; align-items: flex-start; padding-top: 12px; background: #F3F1EC;
  }
  .tab { flex: 1; text-align: center; font-size: 12px; letter-spacing: .18em; color: #A5A098; position: relative; }
  .tab.on { color: #1C1B1E; font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    width: 4px; height: 4px; background: #A83226; border-radius: 50%; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="head">
    <div class="kicker">深度解析</div>
    <div class="title">你的命局全卷</div>
    <div class="chart">
      <div class="pillars">
        <div class="pillar"><span class="zi">乙</span><span class="zi">亥</span><span class="lab">年</span></div>
        <div class="pillar"><span class="zi">甲</span><span class="zi">申</span><span class="lab">月</span></div>
        <div class="pillar"><span class="zi">丙</span><span class="zi">午</span><span class="lab">日</span></div>
        <div class="pillar"><span class="zi">乙</span><span class="zi">未</span><span class="lab">时</span></div>
      </div>
      <div class="who"><b>我自己</b><br>1995 · 属猪</div>
    </div>
  </div>

  <div class="list">
    <div class="row">
      <div class="num">壹</div>
      <div class="mid"><div class="t">主线结构</div><div class="d">识别你命局的主线结构与核心循环</div></div>
      <div class="state read">已读</div>
    </div>
    <div class="row cur">
      <div class="num">贰</div>
      <div class="mid"><div class="t">天赋能力</div><div class="d">区分天赋能力、训练能力与防御性能力</div></div>
      <div class="state now">在读</div>
    </div>
    <div class="row locked">
      <div class="num">叁</div>
      <div class="mid"><div class="t">高配 vs 低配</div><div class="d">同一结构在两种环境下的跑法</div></div>
      <div class="state"><span class="tag">付费</span></div>
    </div>
    <div class="row locked">
      <div class="num">肆</div>
      <div class="mid"><div class="t">系统模式</div><div class="d">运行模式 + 失效环境 + 适配结构</div></div>
      <div class="state"><span class="tag">付费</span></div>
    </div>
    <div class="row locked">
      <div class="num">伍</div>
      <div class="mid"><div class="t">健康续航</div><div class="d">能量规律与恢复杠杆</div></div>
      <div class="state"><span class="tag">付费</span></div>
    </div>
    <div class="row locked">
      <div class="num">陆</div>
      <div class="mid"><div class="t">财富结构</div><div class="d">收入形态匹配度与漏财止损</div></div>
      <div class="state"><span class="tag">付费</span></div>
    </div>
    <div class="row locked">
      <div class="num">柒</div>
      <div class="mid"><div class="t">结构动力学</div><div class="d">能量路径、杠杆点与升级路线</div></div>
      <div class="state"><span class="tag">付费</span></div>
    </div>
    <div class="row locked">
      <div class="num">捌</div>
      <div class="mid"><div class="t">落地手册</div><div class="d">真正杠杆 + 90 天放大行动</div></div>
      <div class="state"><span class="tag">付费</span></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab">今日</div>
    <div class="tab on">深度</div>
    <div class="tab">合盘</div>
    <div class="tab">我的</div>
  </div>
</body>
</html>
