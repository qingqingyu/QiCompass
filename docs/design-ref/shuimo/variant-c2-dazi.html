<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>C2 · 大字道</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    margin: 0 auto; position: relative;
    background:
      radial-gradient(90% 60% at 35% 25%, #F8F7F3 0%, transparent 60%),
      radial-gradient(80% 55% at 75% 90%, #EDEBE4 0%, transparent 55%),
      #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif;
    color: #1C1B1E;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }
  .daodiv {
    position: absolute; left: -8px; top: 118px; width: 410px; height: 560px;
    opacity: 0;
    animation: inkIn 1.5s cubic-bezier(.2,.6,.2,1) .15s forwards,
               breathe 7s ease-in-out 2.5s infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .93; } }
  @keyframes inkIn { from { opacity: 0; filter: blur(7px); } to { opacity: 1; filter: blur(0); } }

  .vtitle {
    position: absolute; top: 150px; right: 58px;
    writing-mode: vertical-rl;
    font-size: 23px; font-weight: 500; letter-spacing: .4em;
    color: #1C1B1E;
    opacity: 0; animation: textIn 1.1s ease .9s forwards;
  }
  .vsub {
    position: absolute; top: 158px; right: 102px;
    writing-mode: vertical-rl;
    font-size: 11.5px; letter-spacing: .42em; color: #77726A;
    opacity: 0; animation: textIn 1.1s ease 1.2s forwards;
  }
  @keyframes textIn { from { opacity: 0; transform: translateY(10px); filter: blur(2px);} to { opacity: 1; transform: none; filter: blur(0);} }

  .seal {
    position: absolute; right: 62px; top: 402px;
    width: 28px; height: 28px; background: #A83226;
    color: #F6F1E7; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(3deg); mix-blend-mode: multiply;
    box-shadow: inset 0 0 0 1.5px rgba(246,241,231,.35);
    opacity: 0; animation: stamp .5s cubic-bezier(.3,1.6,.5,1) 1.7s forwards;
  }
  @keyframes stamp { from { opacity: 0; transform: rotate(3deg) scale(1.8);} to { opacity: .94; transform: rotate(3deg) scale(1);} }

  .footer {
    position: absolute; bottom: 56px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    opacity: 0; animation: textIn 1.1s ease 1.95s forwards;
  }
  .footer .latin {
    font-family: "Avenir Next", "SF Pro Text", sans-serif;
    font-size: 9px; letter-spacing: .55em; text-indent: .55em; color: #9B968C;
  }
  .footer .inkline { width: 54px; height: 1px; background: rgba(28,27,30,.35); }
</style>
</head>
<body>
  <div class="grain"></div>

  <svg class="daodiv" viewBox="0 0 410 560" aria-label="道">
    <defs>
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="11" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
      </filter>
    </defs>
    <text x="50%" y="530" text-anchor="middle" filter="url(#rough)"
          font-family="Kaiti SC, STKaiti, serif" font-size="470" fill="#17161A">道</text>
    <!-- 飞白 -->
    <g fill="#17161A" filter="url(#rough)" opacity=".22">
      <ellipse cx="316" cy="150" rx="9" ry="2.6" transform="rotate(38,316,150)"/>
      <ellipse cx="96" cy="420" rx="7" ry="2.2" transform="rotate(-28,96,420)"/>
    </g>
  </svg>

  <h1 class="vtitle">玄机问道</h1>
  <div class="vsub">大道至简</div>
  <div class="seal">玄</div>

  <div class="footer">
    <div class="inkline"></div>
    <div class="latin">QICOMPASS</div>
  </div>
</body>
</html>
