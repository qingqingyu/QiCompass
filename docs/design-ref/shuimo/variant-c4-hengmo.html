<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>C4 · 一笔横墨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    margin: 0 auto; position: relative;
    background:
      radial-gradient(90% 60% at 30% 20%, #F8F7F3 0%, transparent 60%),
      radial-gradient(80% 55% at 78% 88%, #EDEBE4 0%, transparent 55%),
      #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif;
    color: #1C1B1E;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }

  .head {
    position: absolute; left: 40px; top: 116px;
    opacity: 0; animation: textIn 1.1s ease .8s forwards;
  }
  .head h1 { font-size: 27px; font-weight: 500; letter-spacing: .3em; color: #1C1B1E; }
  .head .latin {
    margin-top: 16px; font-family: "Avenir Next", "SF Pro Text", sans-serif;
    font-size: 9px; letter-spacing: .55em; color: #A5A098;
  }
  @keyframes textIn { from { opacity: 0; transform: translateY(10px); filter: blur(2px);} to { opacity: 1; transform: none; filter: blur(0);} }

  .stroke {
    position: absolute; left: 0; top: 476px; width: 390px; height: 90px;
    opacity: 0;
    animation: inkIn 1.4s cubic-bezier(.2,.6,.2,1) .2s forwards,
               breathe 7s ease-in-out 2.4s infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .92; } }
  @keyframes inkIn { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }

  .vsub {
    position: absolute; right: 44px; bottom: 120px;
    writing-mode: vertical-rl;
    font-size: 12px; letter-spacing: .4em; color: #77726A;
    opacity: 0; animation: textIn 1.1s ease 1.25s forwards;
  }

  .seal {
    position: absolute; right: 52px; top: 508px;
    width: 34px; height: 34px; background: #A83226;
    color: #F6F1E7; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(4deg); mix-blend-mode: multiply;
    box-shadow: inset 0 0 0 1.5px rgba(246,241,231,.35);
    opacity: 0; animation: stamp .5s cubic-bezier(.3,1.6,.5,1) 1.75s forwards;
  }
  @keyframes stamp { from { opacity: 0; transform: rotate(4deg) scale(1.8);} to { opacity: .94; transform: rotate(4deg) scale(1);} }

  .footer {
    position: absolute; bottom: 56px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: .3em; text-indent: .3em; color: #9B968C;
    opacity: 0; animation: textIn 1.1s ease 2s forwards;
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="head">
    <h1>玄机问道</h1>
    <div class="latin">QICOMPASS</div>
  </div>

  <!-- 焦墨横锋：全宽一笔 -->
  <svg class="stroke" viewBox="0 0 390 90" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="roughH">
        <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="4" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
      </filter>
    </defs>
    <g filter="url(#roughH)">
      <path d="M-14,52 C 70,30 150,64 230,44 C 292,29 344,42 404,30"
            fill="none" stroke="#17161A" stroke-width="30" stroke-linecap="round"/>
      <path d="M-14,52 C 70,30 150,64 230,44 C 292,29 344,42 404,30"
            fill="none" stroke="#17161A" stroke-width="10" stroke-linecap="round" opacity=".5"/>
    </g>
    <!-- 枯笔飞白 -->
    <g filter="url(#roughH)" stroke="#F3F1EC" stroke-linecap="round" opacity=".5">
      <path d="M60,44 C 110,40 150,50 200,46" fill="none" stroke-width="2.2"/>
      <path d="M220,46 C 260,42 300,44 340,38" fill="none" stroke-width="1.6"/>
    </g>
  </svg>

  <div class="seal">玄</div>
  <div class="vsub">一画开天 · 问命于笔</div>

  <div class="footer">丙午年 · 甲申月</div>
</body>
</html>
