<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>M1 · 我的 · 已登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 36% at 50% 0%, #F8F7F3 0%, transparent 50%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
    display: flex; flex-direction: column;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .account { flex: none; margin: 66px 34px 0; padding: 18px 18px 16px; border: 1px solid rgba(28,27,30,.22); border-radius: 4px;
             display: flex; align-items: center; gap: 14px; }
  .zavatar { width: 50px; height: 50px; border-radius: 50%; background: #17161A; color: #F3F1EC;
             display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
  .zavatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px;
    background: #A83226; border-radius: 2px; transform: rotate(45deg); border: 2px solid #F3F1EC; }
  .acc b { font-size: 15.5px; font-weight: 500; letter-spacing: .08em; }
  .acc span { display: block; margin-top: 4px; font-size: 10.5px; color: #8B867D; letter-spacing: .1em; }
  .acc .ok { color: #2F5E4A; }

  .sec { flex: none; margin: 22px 34px 0; }
  .sec-k { font-size: 10px; letter-spacing: .4em; color: #A5A098; margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 13px; padding: 13px 2px; border-bottom: 1px solid rgba(28,27,30,.1); }
  .savatar { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(28,27,30,.3);
             display: flex; align-items: center; justify-content: center; font-size: 15px; color: #55524C; }
  .row .mid b { font-size: 14.5px; font-weight: 500; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
  .row .mid span { display: block; margin-top: 3px; font-size: 10px; color: #A5A098; letter-spacing: .06em; }
  .lord { font-size: 9px; color: #A83226; border: 1px solid rgba(168,50,38,.5); border-radius: 2px; padding: 1px 6px; transform: rotate(-2deg); }
  .acts { margin-left: auto; display: flex; gap: 14px; font-size: 10.5px; color: #A5A098; letter-spacing: .1em; }
  .acts .del { color: #B08A88; }
  .newrow { display: flex; align-items: center; gap: 13px; padding: 14px 2px; }
  .plus { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1.4px dashed rgba(28,27,30,.4);
          display: flex; align-items: center; justify-content: center; color: #8B867D; font-size: 16px; }
  .newrow .t { font-size: 13.5px; color: #77726A; letter-spacing: .06em; }

  .bought { margin-top: 4px; }
  .brow { display: flex; align-items: baseline; gap: 10px; padding: 9px 2px; border-bottom: 1px solid rgba(28,27,30,.1); }
  .brow .bt { font-size: 13.5px; letter-spacing: .06em; }
  .brow .bd { margin-left: auto; font-size: 10px; color: #A5A098; letter-spacing: .08em; }
  .brow .bz { font-size: 9.5px; color: #2F5E4A; border: 1px solid rgba(47,94,74,.45); border-radius: 2px; padding: 1px 7px; }

  .setrow { display: flex; align-items: center; padding: 12px 2px; border-bottom: 1px solid rgba(28,27,30,.1);
            font-size: 13.5px; letter-spacing: .1em; }
  .setrow .v { margin-left: auto; font-size: 10.5px; color: #A5A098; }
  .toggle { margin-left: auto; width: 34px; height: 19px; border-radius: 10px; background: rgba(28,27,30,.18); position: relative; }
  .toggle::after { content: ""; position: absolute; left: 2.5px; top: 2.5px; width: 14px; height: 14px; border-radius: 50%; background: #F3F1EC; }

  .sp { flex: 1; }
  .about { text-align: center; font-size: 9.5px; color: #B3AEA4; letter-spacing: .2em; padding-bottom: 8px; }
  .tabbar { flex: none; height: 82px; border-top: 1px solid rgba(28,27,30,.14); display: flex; padding-top: 12px; background: #F3F1EC; }
  .tab { flex: 1; text-align: center; font-size: 12px; letter-spacing: .18em; color: #A5A098; position: relative; }
  .tab.on { color: #1C1B1E; font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    width: 4px; height: 4px; background: #A83226; border-radius: 50%; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="account">
    <div class="zavatar">猪</div>
    <div class="acc">
      <b>我自己</b>
      <span class="ok">已通过 Apple 登录 · 跨设备同步已开</span>
    </div>
  </div>

  <div class="sec">
    <div class="sec-k">我 的 命 盘</div>
    <div class="row">
      <div class="savatar">猪</div>
      <div class="mid"><b>我自己 <span class="lord">命主</span></b><span>1995 年生 · 乙亥 · 早晚子时 00:00 换日</span></div>
      <div class="acts"><span>改名</span><span>重置</span></div>
    </div>
    <div class="row">
      <div class="savatar">鸡</div>
      <div class="mid"><b>男友</b><span>1993 年生 · 癸酉</span></div>
      <div class="acts"><span>改名</span><span class="del">删除</span></div>
    </div>
    <div class="row">
      <div class="savatar">虎</div>
      <div class="mid"><b>妈妈</b><span>1962 年生 · 壬寅</span></div>
      <div class="acts"><span>改名</span><span class="del">删除</span></div>
    </div>
    <div class="newrow">
      <div class="plus">＋</div>
      <div class="t">新建命盘 · 给家人或朋友也排一份</div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-k">已 购</div>
    <div class="bought">
      <div class="brow"><span class="bt">深度解析 · 捌章全解</span><span class="bz">已解锁</span><span class="bd">购买于 8月24日</span></div>
      <div class="brow"><span class="bt">合盘 · 我自己 × 男友</span><span class="bz">已解锁</span><span class="bd">¥30</span></div>
      <div class="brow"><span class="bt">合盘 · 我自己 × 妈妈</span><span class="bz">已解锁</span><span class="bd">¥30</span></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-k">设 置</div>
    <div class="setrow">子时换日 <span style="font-size:10px;color:#A5A098;margin-left:8px;letter-spacing:.05em;">按命主各自设置</span><div class="toggle"></div></div>
    <div class="setrow">关于玄机问道 <span class="v">v1.0 ›</span></div>
  </div>

  <div class="sp"></div>
  <div class="about">玄机问道 · 专业不忽悠</div>
  <div class="tabbar">
    <div class="tab">今日</div><div class="tab">深度</div><div class="tab">合盘</div><div class="tab on">我的</div>
  </div>
</body>
</html>
