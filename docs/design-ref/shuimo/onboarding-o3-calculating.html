<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O3 · 排盘布算</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 60% at 50% 30%, #F8F7F3 0%, transparent 62%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .pond { position: absolute; left: 50%; top: 330px; transform: translate(-50%,-50%); width: 260px; height: 260px; }
  .drop {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%;
    background: #17161A; transform: translate(-50%,-50%);
    animation: dropPulse 2.4s ease-in-out infinite;
  }
  @keyframes dropPulse { 0%,100% { transform: translate(-50%,-50%) scale(1);} 50% { transform: translate(-50%,-50%) scale(.72);} }
  .ring {
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    border: 1.2px solid rgba(23,22,26,.55);
    transform: translate(-50%,-50%) scale(.12); opacity: 0;
  }
  .r1 { width: 240px; height: 240px; animation: ripple 2.4s cubic-bezier(.2,.55,.4,1) infinite; }
  .r2 { width: 240px; height: 240px; animation: ripple 2.4s cubic-bezier(.2,.55,.4,1) .8s infinite; }
  .r3 { width: 240px; height: 240px; animation: ripple 2.4s cubic-bezier(.2,.55,.4,1) 1.6s infinite; }
  @keyframes ripple {
    0% { transform: translate(-50%,-50%) scale(.12); opacity: 0; }
    12% { opacity: .75; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }

  .vtitle {
    position: absolute; top: 322px; right: 56px; writing-mode: vertical-rl;
    font-size: 19px; letter-spacing: .4em; color: #1C1B1E;
    border-left: 1px solid rgba(28,27,30,.22); padding-left: 12px;
    opacity: 0; animation: tIn 1.1s ease .3s forwards;
  }
  .steps {
    position: absolute; left: 0; right: 0; top: 566px; text-align: center;
    font-size: 11px; letter-spacing: .32em; text-indent: .32em; color: #8B867D;
    opacity: 0; animation: tIn 1.1s ease .7s forwards;
  }
  @keyframes tIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px);} to { opacity: 1; transform: none; filter: blur(0);} }

  .ganzhi {
    position: absolute; bottom: 70px; left: 0; right: 0; text-align: center;
    font-size: 10.5px; letter-spacing: .34em; text-indent: .34em; color: #A5A098;
    opacity: 0; animation: tIn 1s ease 1s forwards;
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="pond">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="drop"></div>
  </div>

  <div class="vtitle">排盘布算中</div>
  <div class="steps">四柱 · 十神 · 神煞 · 大运</div>
  <div class="ganzhi">乙亥年 · 甲申月 · 丙午日</div>
</body>
</html>
