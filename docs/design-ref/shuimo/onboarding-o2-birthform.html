<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O2 · 录入生辰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    width: 390px; height: 844px; overflow: hidden; margin: 0 auto; position: relative;
    background: radial-gradient(90% 60% at 40% 15%, #F8F7F3 0%, transparent 60%), #F3F1EC;
    font-family: "Kaiti SC", "STKaiti", serif; color: #1C1B1E;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }

  .vmark {
    position: absolute; top: 76px; left: 36px; writing-mode: vertical-rl;
    font-size: 13px; letter-spacing: .4em; color: #77726A; border-left: 1px solid rgba(28,27,30,.25); padding-left: 10px;
  }
  .title { position: absolute; top: 84px; left: 0; right: 0; text-align: center;
           font-size: 24px; letter-spacing: .26em; text-indent: .26em; opacity: 0; animation: tIn .9s ease .1s forwards; }
  .subtitle { position: absolute; top: 128px; left: 0; right: 0; text-align: center;
              font-size: 11px; letter-spacing: .24em; color: #8B867D; opacity: 0; animation: tIn .9s ease .25s forwards; }
  @keyframes tIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px);} to { opacity: 1; transform: none; filter: blur(0);} }

  .form { position: absolute; left: 52px; right: 52px; top: 196px; display: flex; flex-direction: column; gap: 26px; }
  .field { opacity: 0; animation: tIn .8s ease forwards; }
  .field:nth-child(1) { animation-delay: .4s; } .field:nth-child(2) { animation-delay: .52s; }
  .field:nth-child(3) { animation-delay: .64s; } .field:nth-child(4) { animation-delay: .76s; }
  .label { font-size: 10.5px; letter-spacing: .3em; color: #8B867D; margin-bottom: 8px; }
  .value { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 9px; border-bottom: 1px solid rgba(28,27,30,.22); }
  .value .v { font-size: 16px; letter-spacing: .06em; }
  .value .v.dim { color: #B3AEA4; }
  .value .glyph { font-size: 12px; color: #A5A098; }
  .caret { display: inline-block; width: 1.5px; height: 17px; background: #A83226; vertical-align: -3px; margin-left: 3px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .focus-line { position: relative; }
  .focus-line::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: linear-gradient(90deg, #A83226, rgba(168,50,38,.15)); transform-origin: left; animation: grow .6s ease .9s both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .gender { display: flex; gap: 14px; }
  .gchip {
    flex: 1; text-align: center; padding: 11px 0; font-size: 15px; letter-spacing: .2em; text-indent: .2em;
    border: 1px solid rgba(28,27,30,.3); border-radius: 3px; color: #55524C;
  }
  .gchip.on { background: #1C1B1E; color: #F3F1EC; border-color: #1C1B1E; }

  .privacy { position: absolute; left: 0; right: 0; bottom: 148px; text-align: center;
             font-size: 10px; letter-spacing: .22em; color: #A5A098; opacity: 0; animation: tIn .9s ease 1s forwards; }

  .cta {
    position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%);
    width: 286px; height: 54px; background: #17161A; color: #F3F1EC;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 16px; letter-spacing: .3em; text-indent: .3em; border-radius: 5px;
    opacity: 0; animation: tIn .8s ease 1.15s forwards;
  }
  .cta .seal-dot { width: 7px; height: 7px; background: #A83226; transform: rotate(45deg); }

  .dots { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(28,27,30,.22); }
  .dot.on { background: #A83226; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="vmark">問命</div>

  <div class="title">录入生辰</div>
  <div class="subtitle">八字 · 由此起算</div>

  <div class="form">
    <div class="field focus-line">
      <div class="label">如何称呼这位命主</div>
      <div class="value"><span class="v">我自己<span class="caret"></span></span><span class="glyph">母 / 友 亦可</span></div>
    </div>
    <div class="field">
      <div class="label">出生日期与时刻</div>
      <div class="value"><span class="v">1995年8月24日 · 14:30</span><span class="glyph">未时 ›</span></div>
    </div>
    <div class="field">
      <div class="label">性别</div>
      <div class="gender"><div class="gchip on">男</div><div class="gchip">女</div></div>
    </div>
    <div class="field">
      <div class="label">出生城市</div>
      <div class="value"><span class="v dim">搜索城市（全球可查）</span><span class="glyph">⌕</span></div>
    </div>
  </div>

  <div class="privacy">信息仅用于精确排盘 · 绝不分享</div>

  <div class="cta">开始排盘<span class="seal-dot"></span></div>
  <div class="dots"><span class="dot"></span><span class="dot on"></span></div>
</body>
</html>
