<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向二 · 深空星象金（Moonly / Stardust）</title>
<style>
  :root{
    --bg:#0d1030; --bg2:#1a1040; --gold:#d8b46a; --gold-dim:rgba(216,180,106,.35);
    --fg:#ece6d8; --dim:#8d88a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#05060f;font-family:-apple-system,"PingFang SC",sans-serif;
       display:flex;justify-content:center;padding:40px 0;}
  .phone{width:390px;min-height:844px;color:var(--fg);padding:26px 22px 60px;position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse 90% 45% at 50% -5%, rgba(120,90,200,.35), transparent 60%),
      radial-gradient(ellipse 70% 40% at 85% 30%, rgba(216,180,106,.12), transparent 65%),
      radial-gradient(ellipse 120% 60% at 50% 110%, rgba(40,30,90,.6), transparent 60%),
      linear-gradient(175deg, var(--bg2) 0%, var(--bg) 60%, #080a1d 100%);}
  .stars{position:absolute;inset:0;pointer-events:none;}
  .stars i{position:absolute;background:#fff;border-radius:50%;opacity:.7;}
  .content{position:relative;z-index:2;}
  .cap{font-size:10px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;text-align:center;}
  h1{font-family:Georgia,"Songti SC",serif;font-weight:400;text-align:center;font-size:24px;margin-top:8px;letter-spacing:.12em;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--gold-dim);margin:20px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-dim));}
  .divider::after{background:linear-gradient(90deg,var(--gold-dim),transparent);}
  .divider span{font-size:12px;letter-spacing:.3em;color:var(--gold);}

  /* 星盘罗盘：五行力量 */
  .wheel{position:relative;width:270px;height:270px;margin:6px auto;}
  .wheel svg{display:block;}
  .wheel-center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .wheel-center .pillar{font-family:Georgia,"Songti SC",serif;font-size:40px;letter-spacing:.1em;color:var(--fg);}
  .wheel-center .rel{font-size:11px;letter-spacing:.25em;color:var(--gold);margin-top:6px;}

  .legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px auto 0;max-width:320px;}
  .lg{text-align:center;padding:8px 2px;border:1px solid rgba(216,180,106,.18);border-radius:8px;background:rgba(216,180,106,.05);}
  .lg .e{font-family:Georgia,"Songti SC",serif;font-size:15px;color:var(--fg);}
  .lg .n{font-size:10px;color:var(--gold);margin-top:3px;letter-spacing:.1em;font-variant-numeric:tabular-nums;}
  .lg.peak{border-color:var(--gold);background:rgba(216,180,106,.14);}

  /* 今日信号 双牌 */
  .cards{display:flex;gap:12px;margin-top:4px;}
  .card{flex:1;padding:16px 14px;border-radius:14px;border:1px solid var(--gold-dim);text-align:center;
        background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));}
  .card .glyph{font-family:Georgia,"Songti SC",serif;font-size:22px;color:var(--gold);}
  .card .el{font-family:Georgia,"Songti SC",serif;font-size:26px;margin-top:4px;}
  .card .tag{display:inline-block;font-size:10px;letter-spacing:.2em;color:var(--bg);
             background:var(--gold);border-radius:20px;padding:3px 10px;margin-top:10px;}
  .card.bad .tag{background:#7a6f9e;color:#0d1030;}
  .card p{font-size:11px;color:var(--dim);line-height:1.6;margin-top:10px;}

  /* 时辰 timeline */
  .tl{display:flex;justify-content:space-between;align-items:flex-start;position:relative;padding:14px 4px 0;}
  .tl::before{content:"";position:absolute;top:26px;left:10px;right:10px;height:1px;
              background:linear-gradient(90deg,transparent,var(--gold-dim) 15%,var(--gold-dim) 85%,transparent);}
  .tl .hh{position:relative;width:24px;text-align:center;}
  .tl .dot{width:7px;height:7px;border-radius:50%;background:#5a5480;margin:8px auto 8px;}
  .tl .hh.now .dot{background:var(--gold);box-shadow:0 0 10px 2px rgba(216,180,106,.7);}
  .tl .z{font-family:Georgia,"Songti SC",serif;font-size:13px;color:var(--dim);}
  .tl .hh.now .z{color:var(--gold);}

  /* 黄历 */
  .almanac{display:flex;gap:12px;}
  .al{flex:1;border-radius:14px;padding:14px;border:1px solid rgba(216,180,106,.18);
      background:rgba(13,16,48,.55);backdrop-filter:blur(6px);}
  .al .t{font-size:11px;letter-spacing:.3em;color:var(--gold);text-align:center;}
  .al ul{list-style:none;text-align:center;margin-top:8px;}
  .al li{font-size:13px;padding:3px 0;color:#d8d2c4;letter-spacing:.1em;}

  .tomorrow{text-align:center;font-size:12px;color:var(--dim);letter-spacing:.15em;margin-top:22px;}
  .tomorrow b{color:var(--gold);font-weight:400;}
</style>
</head>
<body>
<div class="phone">
  <div class="stars">
    <i style="left:12%;top:6%;width:2px;height:2px"></i><i style="left:78%;top:9%;width:1.5px;height:1.5px;opacity:.5"></i>
    <i style="left:64%;top:4%;width:2px;height:2px"></i><i style="left:30%;top:12%;width:1.5px;height:1.5px;opacity:.4"></i>
    <i style="left:88%;top:38%;width:1.5px;height:1.5px;opacity:.6"></i><i style="left:7%;top:44%;width:2px;height:2px;opacity:.5"></i>
    <i style="left:52%;top:70%;width:1.5px;height:1.5px;opacity:.35"></i><i style="left:20%;top:82%;width:1.5px;height:1.5px;opacity:.4"></i>
    <i style="left:80%;top:88%;width:1.5px;height:1.5px;opacity:.3"></i>
  </div>
  <div class="content">

    <div class="cap">十一月十八 · 十月初十</div>
    <h1>今日星象</h1>

    <div class="divider"><span>✦</span></div>

    <div class="wheel">
      <!-- 五行雷达罗盘：五角形，顶点=木(右上起顺时针 木火土金水) -->
      <svg viewBox="0 0 270 270" width="270" height="270">
        <!-- 外环双圈 -->
        <circle cx="135" cy="135" r="128" fill="none" stroke="rgba(216,180,106,.25)" stroke-width="1"/>
        <circle cx="135" cy="135" r="122" fill="none" stroke="rgba(216,180,106,.12)" stroke-width="1" stroke-dasharray="2 5"/>
        <!-- 刻度 -->
        <g stroke="rgba(216,180,106,.3)">
          <line x1="135" y1="7" x2="135" y2="14"/><line x1="263" y1="135" x2="256" y2="135"/>
          <line x1="135" y1="263" x2="135" y2="256"/><line x1="7" y1="135" x2="14" y2="135"/>
        </g>
        <!-- 五轴线 -->
        <g stroke="rgba(216,180,106,.15)" stroke-width="1">
          <line x1="135" y1="135" x2="135" y2="22"/>
          <line x1="135" y1="135" x2="251" y2="102"/>
          <line x1="135" y1="135" x2="207" y2="233"/>
          <line x1="135" y1="135" x2="63" y2="233"/>
          <line x1="135" y1="135" x2="19" y2="102"/>
        </g>
        <!-- 内参照环 (50/100) -->
        <polygon points="135,78.5 193,110.5 171,177.5 99,177.5 77,110.5" fill="none" stroke="rgba(216,180,106,.18)" stroke-dasharray="3 4"/>
        <!-- 数据多边形: 木78 火35 土52 金64 水100 (顶点: 木=上, 火=右, 土=右下, 金=左下, 水=左) -->
        <!-- R=113 max; 各轴: 木 r=88 (135,47) 火 r=39.5 (175,116) 土 r=59 (186,181) 金 r=72 (96,190) 水 r=113 (22,135) -->
        <polygon points="135,47 175.4,116.4 186.4,181.2 95.6,189.6 22,135"
                 fill="rgba(216,180,106,.20)" stroke="#d8b46a" stroke-width="1.5"/>
        <g fill="#d8b46a">
          <circle cx="135" cy="47" r="3"/><circle cx="175.4" cy="116.4" r="2.2"/>
          <circle cx="186.4" cy="181.2" r="2.6"/><circle cx="95.6" cy="189.6" r="2.8"/>
          <circle cx="22" cy="135" r="3.4"/>
        </g>
        <!-- 轴标签 -->
        <g font-family="Georgia,'Songti SC',serif" font-size="14" fill="#ece6d8" text-anchor="middle">
          <text x="135" y="34">木</text><text x="262" y="100">火</text><text x="215" y="248">土</text>
          <text x="55" y="248">金</text><text x="8" y="100">水</text>
        </g>
      </svg>
      <div class="wheel-center">
        <div class="pillar">丙子</div>
        <div class="rel">食 神 · 亥月水当令</div>
      </div>
    </div>

    <div class="legend">
      <div class="lg"><div class="e">木</div><div class="n">78 相</div></div>
      <div class="lg"><div class="e">火</div><div class="n">35</div></div>
      <div class="lg"><div class="e">土</div><div class="n">52</div></div>
      <div class="lg"><div class="e">金</div><div class="n">64</div></div>
      <div class="lg peak"><div class="e">水</div><div class="n">100 令</div></div>
    </div>

    <div class="divider"><span>✧ 今日信号 ✧</span></div>

    <div class="cards">
      <div class="card">
        <div class="glyph">☽</div>
        <div class="el">子水</div>
        <span class="tag">喜用 · 上行</span>
        <p>正印护身，思绪清明<br>宜静养、宜谋定</p>
      </div>
      <div class="card bad">
        <div class="glyph">☀</div>
        <div class="el">丙火</div>
        <span class="tag">忌神 · 下行</span>
        <p>食神泄身，精力易散<br>宜收束、忌强出头</p>
      </div>
    </div>

    <div class="divider"><span>✦</span></div>

    <div class="tl">
      <div class="hh"><span class="z">子</span><div class="dot"></div></div>
      <div class="hh"><span class="z">丑</span><div class="dot"></div></div>
      <div class="hh"><span class="z">寅</span><div class="dot"></div></div>
      <div class="hh"><span class="z">卯</span><div class="dot"></div></div>
      <div class="hh"><span class="z">辰</span><div class="dot"></div></div>
      <div class="hh now"><span class="z">巳</span><div class="dot"></div></div>
      <div class="hh"><span class="z">午</span><div class="dot"></div></div>
      <div class="hh"><span class="z">未</span><div class="dot"></div></div>
      <div class="hh"><span class="z">申</span><div class="dot"></div></div>
      <div class="hh"><span class="z">酉</span><div class="dot"></div></div>
      <div class="hh"><span class="z">戌</span><div class="dot"></div></div>
      <div class="hh"><span class="z">亥</span><div class="dot"></div></div>
    </div>

    <div class="divider"><span>✦</span></div>

    <div class="almanac">
      <div class="al"><div class="t">宜</div><ul><li>会友</li><li>沐浴</li><li>立券</li></ul></div>
      <div class="al"><div class="t">忌</div><ul><li>开市</li><li>动土</li><li>远行</li></ul></div>
    </div>

    <p class="tomorrow">明日 · <b>丁丑</b> 伤官 · 冲未</p>

  </div>
</div>
</body>
</html>
